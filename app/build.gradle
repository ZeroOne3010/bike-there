plugins {
    id 'com.android.application' version '8.13.2'
}

android {
    namespace 'dev.zeroone.bikethere'
    compileSdk 36
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'dev.zeroone.bikethere'
        minSdk 26
        targetSdk 36
        versionCode = (System.getenv('BIKE_THERE_VERSION_CODE') ?: '4000').toInteger()
        versionName = System.getenv('BIKE_THERE_VERSION_NAME') ?: '0.4.0'
    }

    signingConfigs {
        if (System.getenv('BIKE_THERE_KEYSTORE')) {
            release {
                storeFile file(System.getenv('BIKE_THERE_KEYSTORE'))
                storeType 'PKCS12'
                storePassword System.getenv('BIKE_THERE_KEYSTORE_PASSWORD')
                keyAlias 'bike-there'
                keyPassword System.getenv('BIKE_THERE_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            if (signingConfigs.findByName('release')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.11.0'
    testImplementation 'junit:junit:4.13.2'
}
