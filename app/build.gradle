plugins {
    id 'com.android.application' version '8.13.2'
}

def appVersion = providers.environmentVariable('BIKE_THERE_VERSION_NAME')
        .orElse(providers.fileContents(rootProject.layout.projectDirectory.file('version.txt')).asText.map { it.trim() })
        .get()
if (!(appVersion ==~ /(?:0|[1-9][0-9]{0,3})\.(?:0|[1-9][0-9]{0,2})\.(?:0|[1-9][0-9]{0,2})/)) {
    throw new GradleException("Invalid Android version: ${appVersion}")
}
def (major, minor, patch) = appVersion.tokenize('.').collect { it.toLong() }
def appVersionCode = major * 1_000_000 + minor * 1_000 + patch
if (appVersionCode < 1 || appVersionCode > 2_100_000_000) {
    throw new GradleException("Android version code is out of range: ${appVersionCode}")
}

android {
    namespace 'dev.zeroone.bikethere'
    compileSdk 36
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'dev.zeroone.bikethere'
        minSdk 26
        targetSdk 36
        versionCode = appVersionCode.toInteger()
        versionName = appVersion
    }

    signingConfigs {
        if (System.getenv('BIKE_THERE_KEYSTORE')) {
            release {
                storeFile file(System.getenv('BIKE_THERE_KEYSTORE'))
                storeType 'PKCS12'
                storePassword System.getenv('BIKE_THERE_KEYSTORE_PASSWORD')
                keyAlias 'bike-there'
                keyPassword System.getenv('BIKE_THERE_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            if (signingConfigs.findByName('release')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.11.0'
    testImplementation 'junit:junit:4.13.2'
}
