name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Read Android version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(cat version.txt)"
          fi
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$ ]]; then
            echo 'Expected a version such as 0.6.1.' >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "BIKE_THERE_VERSION_NAME=${tag#v}" >> "$GITHUB_ENV"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Test and build
        run: bash gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Enable hosted emulator acceleration
        run: sudo setfacl -m "u:$(id -un):rw" /dev/kvm
      - name: Verify fresh install opens on Android 16
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        timeout-minutes: 10
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -no-audio -gpu swiftshader -no-snapshot -no-boot-anim -no-metrics
          script: |
            adb shell cmd location set-location-enabled false
            adb install -g app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n dev.zeroone.bikethere.debug/dev.zeroone.bikethere.MainActivity
            sleep 2
            adb shell pidof dev.zeroone.bikethere.debug || { adb logcat -d -b crash; exit 1; }
            adb shell uiautomator dump /data/local/tmp/bike-there.xml
            adb shell cat /data/local/tmp/bike-there.xml | grep -Fq 'text="BIKE THERE"' || { adb logcat -d -b crash; exit 1; }
            adb shell cat /data/local/tmp/bike-there.xml | grep -Fq 'text="Location off"'
            adb shell cat /data/local/tmp/bike-there.xml | grep -Fq 'text="GPS off"'
      - name: Upload test APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Bike-There-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && !github.event.deleted && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-24.04
    concurrency:
      group: android-release-${{ needs.build.outputs.release_tag }}
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check whether this version needs publishing
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          published=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\" and .draft == false) | .id")
          if [[ -n "$published" ]]; then
            echo "$RELEASE_TAG is already published."
            exit 0
          fi
          ref="refs/tags/$RELEASE_TAG"
          tagged_commit=$(git ls-remote --tags --sort=refname origin "$ref" "${ref}^{}" | awk 'END {print $1}')
          if [[ -n "$tagged_commit" && "$tagged_commit" != "$(git rev-parse HEAD)" ]]; then
            echo "$RELEASE_TAG already points to another commit. Publish from that tag or bump version.txt."
            exit 0
          fi
          if [[ -z "$tagged_commit" ]]; then
            echo 'create_tag=true' >> "$GITHUB_OUTPUT"
          fi
          echo 'needed=true' >> "$GITHUB_OUTPUT"
          echo "BIKE_THERE_VERSION_NAME=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        if: steps.publish.outputs.needed == 'true'
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build and verify signed APK
        if: steps.publish.outputs.needed == 'true'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          BIKE_THERE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EXPECTED_CERTIFICATE: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SIGNING_KEYSTORE_BASE64" || -z "$BIKE_THERE_KEYSTORE_PASSWORD" || ! "$EXPECTED_CERTIFICATE" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Set up Android signing using scripts/setup-signing.sh first." >&2
            exit 1
          fi
          umask 077
          export BIKE_THERE_KEYSTORE="$RUNNER_TEMP/bike-there.p12"
          trap 'rm -f "$BIKE_THERE_KEYSTORE"' EXIT
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$BIKE_THERE_KEYSTORE"
          unset SIGNING_KEYSTORE_BASE64
          bash gradlew --no-daemon assembleRelease
          apk="app/build/outputs/apk/release/app-release.apk"
          fingerprint=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" |
                        awk '/Signer #1 certificate SHA-256 digest:/ {print $NF}')
          if [[ "$fingerprint" != "$EXPECTED_CERTIFICATE" ]]; then
            echo "APK signing certificate does not match the configured release key." >&2
            exit 1
          fi
          cp "$apk" "Bike-There-$RELEASE_TAG.apk"
      - name: Publish APK to GitHub Releases
        if: steps.publish.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CREATE_TAG: ${{ steps.publish.outputs.create_tag }}
        shell: bash
        run: |
          if [[ "$CREATE_TAG" == 'true' ]]; then
            git push origin "HEAD:refs/tags/$RELEASE_TAG"
          fi
          gh release create "$RELEASE_TAG" "Bike-There-$RELEASE_TAG.apk" --verify-tag --generate-notes
