name: Reproduce Android startup
on:
  push:
    branches: [diagnose/android-startup]
permissions:
  contents: read
  actions: read
jobs:
  launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download the published preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 45707062234 --repo ZeroOne3010/bike-there --name Bike-There-debug --dir published
      - name: Enable hosted emulator acceleration
        run: sudo setfacl -m "u:$(id -un):rw" /dev/kvm
      - uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -no-audio -gpu swiftshader -no-snapshot -no-boot-anim -no-metrics
          script: |
            adb install published/app-debug.apk
            adb shell am start -W -n dev.zeroone.bikethere.debug/dev.zeroone.bikethere.MainActivity
            sleep 3
            adb logcat -d -b crash
            adb shell pidof dev.zeroone.bikethere.debug
